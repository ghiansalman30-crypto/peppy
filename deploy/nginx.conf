# /etc/nginx/conf.d/peppyrh.fun.conf. TLS arrives through the VPS stream router on 127.0.0.1:8443 with PROXY protocol.
limit_req_zone $binary_remote_addr zone=peppy_api:10m rate=5r/s;
map $uri $peppy_cache {
  ~^/assets/      "public, max-age=604800";
  ~\.(css|js)$    "public, max-age=600";
  default         "no-cache";
}
server {
  listen 127.0.0.1:8443 ssl proxy_protocol;
  server_name peppyrh.fun;
  ssl_certificate /etc/letsencrypt/live/peppyrh.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/peppyrh.fun/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  root /var/www/peppyrh.fun/site;
  index index.html;
  server_tokens off;
  gzip on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header Cache-Control $peppy_cache always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  location /api/ {
    limit_req zone=peppy_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:5451;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ =404; }
}
server {
  listen 127.0.0.1:8443 ssl proxy_protocol;
  server_name www.peppyrh.fun;
  ssl_certificate /etc/letsencrypt/live/peppyrh.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/peppyrh.fun/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  return 301 https://peppyrh.fun$request_uri;
}
server {
  listen 80;
  listen [::]:80;
  server_name peppyrh.fun www.peppyrh.fun;
  location /.well-known/acme-challenge/ { root /var/www/peppyrh.fun/site; }
  location / { return 301 https://peppyrh.fun$request_uri; }
}
